version: '3.8'

services:
  # --- MongoDB Database ---
  mongodb:
    image: mongo:7.0
    container_name: axiocruit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: axiocruit
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axiocruit-network

  # --- AI Microservice (NLP & CV Matching) ---
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: axiocruit-ai
    restart: unless-stopped
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8002
      - OLLAMA_URL=http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - axiocruit-network

  # --- Proctoring Microservice (MediaPipe & Gaze Detection) ---
  proctoring-service:
    build:
      context: .
      dockerfile: Dockerfile.proctor
    container_name: axiocruit-proctor
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      axiocruit-network:
        aliases:
          - proctor
          - proctoring-service

  # --- Redis (Socket.IO Adapter & Pub/Sub Clustering) ---
  redis:
    image: redis:7-alpine
    container_name: axiocruit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axiocruit-network

  # --- Core Express Backend & Socket.IO Gateway ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: axiocruit-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/axiocruit
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TURN_SECRET=${TURN_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-axiocruit_enterprise_jwt_secret_change_in_prod}
      - CLIENT_URL=http://localhost:3000
      - AI_SERVICE_URL=http://ai-service:8002
      - PROCTORING_SERVICE_URL=http://proctoring-service:8001
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      proctoring-service:
        condition: service_healthy
    volumes:
      - uploads-data:/app/public/uploads
    networks:
      - axiocruit-network

  # --- Frontend Client (Nginx SPA + Reverse Proxy) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: axiocruit-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - proctoring-service
      - ai-service
    networks:
      - axiocruit-network

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  uploads-data:
    driver: local

networks:
  axiocruit-network:
    driver: bridge
