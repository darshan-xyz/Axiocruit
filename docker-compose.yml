version: '3.8'

services:
  # --- MongoDB Database ---
  mongodb:
    image: mongo:7.0
    container_name: procruit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: procruit
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procruit-network

  # --- AI Microservice (NLP & CV Matching) ---
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: procruit-ai
    restart: unless-stopped
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8002
      - OLLAMA_URL=http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - procruit-network

  # --- Proctoring Microservice (MediaPipe & Gaze Detection) ---
  proctoring-service:
    build:
      context: .
      dockerfile: Dockerfile.proctor
    container_name: procruit-proctor
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      procruit-network:
        aliases:
          - proctor
          - proctoring-service

  # --- Core Express Backend & Socket.IO Gateway ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: procruit-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/procruit
      - JWT_SECRET=${JWT_SECRET:-procruit_enterprise_jwt_secret_change_in_prod}
      - CLIENT_URL=http://localhost:3000
      - AI_SERVICE_URL=http://ai-service:8002
      - PROCTORING_SERVICE_URL=http://proctoring-service:8001
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      proctoring-service:
        condition: service_healthy
    volumes:
      - uploads-data:/app/public/uploads
    networks:
      - procruit-network

  # --- Frontend Client (Nginx SPA + Reverse Proxy) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: procruit-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - proctoring-service
      - ai-service
    networks:
      - procruit-network

volumes:
  mongo-data:
    driver: local
  uploads-data:
    driver: local

networks:
  procruit-network:
    driver: bridge
